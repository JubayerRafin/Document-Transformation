name: Tests

# Unit tests on every pull request and on main: the engine (Python), the website (Next.js) and
# the site API (Cloudflare Worker). GPU, model-server and BabelDOC tests skip here; run those on a
# GPU server (docs/ENGINE_SERVICE.md, "Testing many documents").
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt pymupdf==1.27.2.2 numpy Pillow python-docx python-pptx \
            opencv-python-headless python-bidi==0.6.12 scipy pyyaml \
            pdfplumber==0.11.9 camelot-py==1.0.9 pypdf==5.9.0
      # The last line is the extraction stage (requirements-deep-doc.txt without docling).
      - name: Unit tests
        run: python -m unittest discover -s tests -t .

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run

  site-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5   # the build copies assets with a small Python script
        with:
          python-version: '3.12'
      # npm test builds the website first (pretest), so its packages are needed too.
      - run: npm ci --prefix ../frontend
      - run: npm ci
      - run: npm test
